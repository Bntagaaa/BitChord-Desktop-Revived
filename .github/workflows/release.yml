name: Release
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.8.2); creates a draft release after successful builds"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  linux:
    name: Linux · AppImage, deb, rpm
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Work out the version
        id: version
        run: |
          version="${{ inputs.version }}"
          [ -n "$version" ] || version="${GITHUB_REF_NAME#v}"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version"

      - name: Write local.properties
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

      - name: Packaging tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot binutils file

      # Restore a verified packaging binary before trying the network. A regular
      # cache action saves only at the end of a successful job; on #173 the tool
      # downloaded correctly, but the later packaging error prevented caching.
      # Split restore/save so successful downloads survive subsequent failures.
      - name: Restore verified AppImage tool cache
        id: appimagetool-cache
        uses: actions/cache/restore@v4
        with:
          path: appimagetool.AppImage
          key: appimagetool-x86_64-verified-stable-v2

      - name: Download and verify AppImage packaging tool
        shell: bash
        run: |
          set -euo pipefail
          expected_191="ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0"
          # 1.9.0 fallback digest recorded by successful download in CI #173.
          expected_190="46fdd785094c7f6e545b61afcfb0f3d98d8eab243f644b4b17698c01d06083d1"
          # Additional pinned official release, if both stable release assets
          # are temporarily unavailable through GitHub's downloads CDN.
          expected_continuous="e8c1169c4af66c3184d7ee110713d4be04befe671fa358e2c1591ee840553b03"
          tool_path="appimagetool.AppImage"

          checksum_valid() {
            local sha
            [[ -s "$1" ]] || return 1
            sha="$(sha256sum "$1" | cut -d ' ' -f 1)"
            [[ "$sha" == "$expected_191" || "$sha" == "$expected_190" || "$sha" == "$expected_continuous" ]]
          }
          valid_appimage() {
            [[ "$(wc -c < "$1")" -ge 10000000 ]] &&
              [[ "$(od -An -tx1 -j8 -N3 "$1" | tr -d '[:space:]')" == "414902" ]]
          }

          if checksum_valid "$tool_path" && valid_appimage "$tool_path"; then
            echo "Reusing checksum-verified cached appimagetool"
          else
            rm -f "$tool_path"
            urls=(
              # The GitHub Releases *API* asset endpoint can stream bytes or
              # redirect to object storage, independently of the /download URL
              # which intermittently returned HTTP 504 on CI runs #172/#174.
              "https://api.github.com/repos/AppImage/appimagetool/releases/assets/324406736"
              "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage"
              "https://api.github.com/repos/AppImage/appimagetool/releases/assets/184558942"
              "https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-x86_64.AppImage"
              "https://api.github.com/repos/AppImage/appimagetool/releases/assets/715388534"
            )
            digests=(
              "$expected_191" "$expected_191"
              "$expected_190" "$expected_190"
              "$expected_continuous"
            )
            tmp="$(mktemp)"
            trap 'rm -f "$tmp"' EXIT
            for idx in "${!urls[@]}"; do
              url="${urls[$idx]}"
              rm -f "$tmp"
              curl_args=(
                --fail --location --silent --show-error
                --connect-timeout 20 --max-time 120
                --retry 2 --retry-all-errors --retry-delay 3
              )
              if [[ "$url" == https://api.github.com/* ]]; then
                curl_args+=(--header "Accept: application/octet-stream"
                            --header "X-GitHub-Api-Version: 2022-11-28")
              fi
              echo "Trying appimagetool source $((idx + 1))/${#urls[@]}"
              if curl "${curl_args[@]}" --output "$tmp" "$url"; then
                if valid_appimage "$tmp" &&
                   echo "${digests[$idx]}  $tmp" | sha256sum --check --status; then
                  mv "$tmp" "$tool_path"
                  echo "Accepted and SHA-256 verified appimagetool source $((idx + 1))"
                  break
                fi
                echo "::warning::Rejected non-AppImage or checksum mismatch from source $((idx + 1))"
              else
                echo "::warning::Download source $((idx + 1)) unavailable; trying the next source"
              fi
            done
            if ! checksum_valid "$tool_path" || ! valid_appimage "$tool_path"; then
              echo "::error::All verified appimagetool sources failed (GitHub asset API and release URLs)"
              exit 1
            fi
          fi
          chmod +x "$tool_path" gradlew desktopApp/packaging/appimage.sh
          sha256sum "$tool_path"

      # Save immediately after a validated download, not at the end of the
      # entire packaging job, so unrelated packaging/tests cannot erase the cache.
      - name: Save verified AppImage tool cache
        if: steps.appimagetool-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: appimagetool.AppImage
          key: appimagetool-x86_64-verified-stable-v2

      # appimagetool downloads the AppImage runtime itself if --runtime-file is
      # omitted. That internal download failed with CDN 504 on AppImage build #177.
      # Pin the upstream asset by immutable release asset ID + official SHA-256.
      - name: Restore verified AppImage type-2 runtime
        id: appimage-runtime-cache
        uses: actions/cache/restore@v4
        with:
          path: runtime-x86_64
          key: appimage-runtime-x86_64-657374641-617aa77314d57c8b8e4fae9c3f0b35af7b30d5529cb69e98f64f92510ed98a46

      - name: Download and verify AppImage type-2 runtime
        shell: bash
        run: |
          set -euo pipefail
          runtime="runtime-x86_64"
          expected_sha="617aa77314d57c8b8e4fae9c3f0b35af7b30d5529cb69e98f64f92510ed98a46"
          expected_size=944632
          valid_runtime() {
            [[ -s "$1" ]] &&
              [[ "$(wc -c < "$1")" -eq "$expected_size" ]] &&
              [[ "$(od -An -tx1 -N4 "$1" | tr -d '[:space:]')" == "7f454c46" ]] &&
              echo "$expected_sha  $1" | sha256sum --check --status
          }

          if valid_runtime "$runtime"; then
            echo "Using verified cached AppImage type-2 runtime"
          else
            rm -f "$runtime"
            urls=(
              "https://api.github.com/repos/AppImage/type2-runtime/releases/assets/657374641"
              "https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64"
            )
            tmp="$(mktemp)"
            trap 'rm -f "$tmp"' EXIT
            for idx in "${!urls[@]}"; do
              url="${urls[$idx]}"
              curl_args=(
                --fail --location --silent --show-error
                --connect-timeout 20 --max-time 120
                --retry 2 --retry-all-errors --retry-delay 3
              )
              if [[ "$url" == https://api.github.com/* ]]; then
                curl_args+=(--header "Accept: application/octet-stream"
                            --header "X-GitHub-Api-Version: 2022-11-28")
              fi
              rm -f "$tmp"
              echo "Fetching verified AppImage runtime source $((idx + 1))/${#urls[@]}"
              if curl "${curl_args[@]}" --output "$tmp" "$url" && valid_runtime "$tmp"; then
                mv "$tmp" "$runtime"
                echo "AppImage runtime validated (source $((idx + 1)), size=$expected_size)"
                break
              fi
              echo "::warning::AppImage runtime source $((idx + 1)) failed verification/download"
            done
            if ! valid_runtime "$runtime"; then
              echo "::error::All verified AppImage runtime sources failed"
              exit 1
            fi
          fi
          chmod +x "$runtime"
          sha256sum "$runtime"

      # Save before the expensive build, so a later packaging/test failure
      # does not discard the successfully verified runtime download.
      - name: Save verified AppImage type-2 runtime
        if: steps.appimage-runtime-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: runtime-x86_64
          key: appimage-runtime-x86_64-657374641-617aa77314d57c8b8e4fae9c3f0b35af7b30d5529cb69e98f64f92510ed98a46

      # appimagetool 1.9.x invokes desktop-file-validate while packaging.
      # The Ubuntu 22.04 runner does not guarantee that binary is preinstalled.
      # Required for both the manual AppImage build and updater audit workflow.
      - name: Install AppImage desktop-entry validator
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends desktop-file-utils
          command -v desktop-file-validate

      - run: chmod +x gradlew

      - name: Tests
        run: ./gradlew :shared:jvmTest :desktopApp:test -Pbitchord.version=${{ steps.version.outputs.value }}

      - name: Build deb, rpm and the app image
        run: |
          ./gradlew :desktopApp:packageDeb :desktopApp:packageRpm :desktopApp:createDistributable \
            -Pbitchord.version=${{ steps.version.outputs.value }}

      - name: The analyser and models are in the jar
        run: |
          jar=$(ls desktopApp/build/compose/binaries/main/app/BitChord/lib/app/desktopApp*.jar)
          jar tf "$jar" | grep -q 'native/libbitchord_analysis.so'
          jar tf "$jar" | grep -q 'models/.*\.onnx'

      - name: Build the AppImage
        shell: bash
        env:
          APPIMAGETOOL_RUNTIME_FILE: ${{ github.workspace }}/runtime-x86_64
        run: |
          set -euo pipefail
          appimage="dist/BitChord-${{ steps.version.outputs.value }}-linux-x86_64.AppImage"
          desktopApp/packaging/appimage.sh \
            desktopApp/build/compose/binaries/main/app/BitChord \
            "$appimage" \
            "$PWD/appimagetool.AppImage" \
            "$PWD/runtime-x86_64"
          # Ensure that packaging produced a real type-2 AppImage, not an HTTP error page.
          test -s "$appimage"
          [[ "$(wc -c < "$appimage")" -ge 10000000 ]]
          [[ "$(od -An -tx1 -j8 -N3 "$appimage" | tr -d '[:space:]')" == "414902" ]]
          chmod +x "$appimage"
          "$appimage" --appimage-extract >/dev/null
          test -x squashfs-root/AppRun
          test -x squashfs-root/usr/bin/BitChord
          sha256sum "$appimage"

      - name: Real AppImage GUI relaunch and recovery
        env:
          BUILD_VERSION: ${{ steps.version.outputs.value }}
        run: |
          xvfb-run -a python3 desktopApp/packaging/tests/appimage-relaunch.py \
            "dist/BitChord-$BUILD_VERSION-linux-x86_64.AppImage" --output "$RUNNER_TEMP/updater-appimage"

      - name: Collect
        run: |
          v=${{ steps.version.outputs.value }}
          mkdir -p dist
          cp desktopApp/build/compose/binaries/main/deb/*.deb "dist/BitChord-$v-linux-amd64.deb"
          cp desktopApp/build/compose/binaries/main/rpm/*.rpm "dist/BitChord-$v-linux-x86_64.rpm"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: linux-updater-diagnostics
          path: |
            ${{ runner.temp }}/updater-appimage/results.json
            ${{ runner.temp }}/updater-appimage/**/install.log
            ${{ runner.temp }}/updater-appimage/**/status

      - uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: dist/*

  arch:
    name: Arch / CachyOS · convert Linux DEB
    needs: linux
    if: ${{ !contains(inputs.version || github.ref_name, '-') }}
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Reuse the exact DEB produced by the Linux job; no second Gradle build.
      - uses: actions/download-artifact@v4
        with:
          name: linux-artifacts
          path: dist

      - name: Install Arch packaging utilities
        run: pacman -Syu --noconfirm --needed python git sudo

      - name: Identify release and prepare source artifact
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-${REF_NAME#v}}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          test -f "dist/BitChord-$version-linux-amd64.deb"
          python packaging/aur/prepare_release.py \
            --version "$version" --deb "dist/BitChord-$version-linux-amd64.deb"

      - name: Build and verify pacman package (no root builds)
        run: |
          set -euo pipefail
          useradd --create-home aurbuilder
          printf "%s\n" "aurbuilder ALL=(ALL) NOPASSWD: /usr/bin/pacman" > /etc/sudoers.d/aurbuilder
          chmod 440 /etc/sudoers.d/aurbuilder
          chown -R aurbuilder:aurbuilder packaging/aur
          runuser -u aurbuilder -- bash -c '
            set -euo pipefail
            cd packaging/aur
            makepkg --printsrcinfo > .SRCINFO
            makepkg --verifysource
            makepkg --syncdeps --noconfirm --cleanbuild
          '

      - name: Inspect and collect Arch artifact
        run: |
          set -euo pipefail
          pkg=$(find packaging/aur -maxdepth 1 -name "*.pkg.tar.zst" -print -quit)
          test -n "$pkg"
          bsdtar -tf "$pkg" > /tmp/arch-files.txt
          grep -Fxq "opt/bitchord-desktop-revived/bin/BitChord" /tmp/arch-files.txt
          grep -Fxq "usr/bin/bitchord-desktop-revived" /tmp/arch-files.txt
          grep -Fxq "usr/share/applications/bitchord-desktop-revived.desktop" /tmp/arch-files.txt
          cp "$pkg" dist/
          sha256sum dist/*.pkg.tar.zst

      - uses: actions/upload-artifact@v4
        with:
          name: arch-artifacts
          path: dist/*.pkg.tar.zst
          if-no-files-found: error

  windows:
    name: Windows · installer, msi, portable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: WiX Toolset 3
        shell: pwsh
        run: |
          $url = "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip"
          Invoke-WebRequest -Uri $url -OutFile wix.zip
          Expand-Archive wix.zip -DestinationPath "$env:RUNNER_TEMP\wix"
          "$env:RUNNER_TEMP\wix" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: CMake version
        run: cmake --version

      - name: Work out the version
        id: version
        shell: bash
        run: |
          version="${{ inputs.version }}"
          [ -n "$version" ] || version="${GITHUB_REF_NAME#v}"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version"

      - name: Write local.properties
        shell: bash
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

      - name: Tests
        run: .\gradlew.bat :shared:jvmTest :desktopApp:test "-Pbitchord.version=${{ steps.version.outputs.value }}"

      - name: Build MSI and application image
        run: |
          .\gradlew.bat :desktopApp:packageMsi :desktopApp:createDistributable "-Pbitchord.version=${{ steps.version.outputs.value }}"

      - name: Verify Automix native runtime and packaged models
        shell: pwsh
        run: ./desktopApp/packaging/tests/windows-automix-check.ps1

      - name: The analyser and models are in the jar
        shell: bash
        run: |
          jar=$(ls desktopApp/build/compose/binaries/main/app/BitChord/app/desktopApp*.jar)
          jar tf "$jar" | grep -q 'native/bitchord_analysis.dll'
          jar tf "$jar" | grep -q 'models/.*\.onnx'
          # WinRT, so only MSVC can build it and only this job ever does.
          jar tf "$jar" | grep -q 'native/bitchord_smtc.dll'

      - name: Collect
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.value }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item desktopApp/build/compose/binaries/main/msi/*.msi "dist/BitChord-$v-windows-x64.msi"
          ./desktopApp/packaging/windows/create-setup.ps1 -Msi "dist/BitChord-$v-windows-x64.msi" -Output "dist/BitChord-$v-windows-x64-setup.exe"
          $appRoot = (Resolve-Path "desktopApp/build/compose/binaries/main/app").Path
          $portableRoot = Join-Path $appRoot "BitChord"
          if (-not (Test-Path -LiteralPath (Join-Path $portableRoot "BitChord.exe"))) {
            throw "Portable launcher is missing"
          }
          New-Item -ItemType File -Force (Join-Path $portableRoot ".bitchord-portable") | Out-Null
          $zipPath = Join-Path (Resolve-Path "dist").Path "BitChord-$v-windows-x64-portable.zip"
          Push-Location $appRoot
          try {
            & 7z a -tzip -mx=5 $zipPath "BitChord"
            if ($LASTEXITCODE -ne 0) { throw "Portable ZIP creation failed" }
          } finally { Pop-Location }
          # Test the exact archive being published, not a synthetic ZIP.
          ./desktopApp/packaging/tests/windows-portable-inplace-checks.ps1 -RealArchive $zipPath
          Get-ChildItem dist | Format-Table Name, Length

      - name: Validate Windows updater helper and actual artifacts
        shell: pwsh
        env:
          BUILD_VERSION: ${{ steps.version.outputs.value }}
        run: ./desktopApp/packaging/tests/windows-updater-checks.ps1 -Artifacts dist -Version $env:BUILD_VERSION

      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: dist/*

  release:
    name: Publish
    needs: [linux, windows, arch]
    if: ${{ always() && needs.linux.result == 'success' && needs.windows.result == 'success' && (needs.arch.result == 'success' || needs.arch.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate release version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            version="${REF_NAME#v}"
          else
            version="$INPUT_VERSION"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::Release version must be MAJOR.MINOR.PATCH with an optional prerelease suffix"
            exit 1
          fi
          echo "RELEASE_TAG=v$version" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          pattern: "*-artifacts"
          merge-multiple: true
          path: dist

      - name: Validate artifacts and publish checksums
        shell: bash
        run: |
          set -euo pipefail
          v="${RELEASE_TAG#v}"
          for suffix in windows-x64-setup.exe windows-x64.msi windows-x64-portable.zip linux-x86_64.AppImage linux-amd64.deb linux-x86_64.rpm; do
            test -s "dist/BitChord-$v-$suffix"
          done
          (cd dist && rm -f SHA256SUMS && sha256sum -- * > SHA256SUMS && sha256sum --check SHA256SUMS)
          if [[ "$v" == *-* ]]; then echo 'IS_PRERELEASE=true' >> "$GITHUB_ENV"; else echo 'IS_PRERELEASE=false' >> "$GITHUB_ENV"; fi

      - name: Select release notes
        shell: bash
        run: |
          set -euo pipefail
          notes="docs/releases/${RELEASE_TAG}.md"
          if [ -f "$notes" ]; then
            cp "$notes" "$RUNNER_TEMP/release-notes.md"
          else
            printf '# BitChord %s\n\nDownload the Windows, Linux, and Arch packages below.\n' "$RELEASE_TAG" > "$RUNNER_TEMP/release-notes.md"
          fi
          echo "RELEASE_NOTES_PATH=$RUNNER_TEMP/release-notes.md" >> "$GITHUB_ENV"

      - name: Draft the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: BitChord ${{ env.RELEASE_TAG }}
          draft: true
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          body_path: ${{ env.RELEASE_NOTES_PATH }}
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
