name: Compose visual parity

on:
  push:
    branches: [1.9.2-Compose-Dekstop]
    paths:
      - .github/workflows/compose-visual-parity.yml
      - .github/scripts/compare-desktop-renders.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compose-visual-parity
  cancel-in-progress: true

jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 348b613a0c3db1a54de56483ea6f8748d6465211
          path: baseline
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install image comparison dependency
        run: python -m pip install Pillow==11.3.0
      - name: Install Linux display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
      - name: Render baseline and candidate on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          for tree in baseline candidate; do
            ui=desktopUi
            if [[ "$tree" == baseline ]]; then ui=sharedUi; fi
            (
              cd "$tree"
              xvfb-run -a bash gradlew ":$ui:jvmTest" --tests '*.LandscapePlayerMotionTest' \
                :desktopApp:test --tests '*.DesktopPipUiTest' \
                -Pbitchord.version=test-visua --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/$tree-render.log"
            )
          done
      - name: Render baseline and candidate on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($tree in @('baseline', 'candidate')) {
            $ui = if ($tree -eq 'baseline') { 'sharedUi' } else { 'desktopUi' }
            Push-Location $tree
            try {
              .\gradlew.bat ":${ui}:jvmTest" --tests '*.LandscapePlayerMotionTest' `
                :desktopApp:test --tests '*.DesktopPipUiTest' `
                "-Pbitchord.version=test-visua" --console=plain 2>&1 | Tee-Object -FilePath "$env:GITHUB_WORKSPACE/$tree-render.log"
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            } finally { Pop-Location }
          }
      - name: Report render build or test errors
        if: failure()
        shell: python
        run: |
          from pathlib import Path
          for path in Path(".").glob("*-render.log"):
              text = path.read_text(errors="replace")
              excerpt = text[text.rfind("FAILURE:"):] if "FAILURE:" in text else text[-5000:]
              excerpt = excerpt[:5000].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print("::error title=" + path.name + "::" + excerpt)
      - name: Compare actual pixels, including alpha
        run: python candidate/.github/scripts/compare-desktop-renders.py --baseline baseline --candidate candidate --output results
      - name: Upload source, candidate and difference renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-render-parity-${{ runner.os }}
          path: |
            results/
            *-render.log
            baseline/sharedUi/build/reports/landscape-player/
            candidate/desktopUi/build/reports/landscape-player/
            baseline/desktopApp/build/reports/pip-rebuild/
            candidate/desktopApp/build/reports/pip-rebuild/
          if-no-files-found: warn
