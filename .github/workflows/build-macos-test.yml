name: Build Test macOS

on:
  workflow_dispatch:
  pull_request:
    branches: [integration/v1.8.4]
  push:
    branches: [integration/v1.8.4, feature/macos-desktop-support-1.8.4]

permissions:
  contents: read
concurrency:
  group: macos-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS · ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            java: aarch64
          - runner: macos-15-intel
            arch: x64
            java: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          architecture: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate native build environment
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          uname -m
          sw_vers
          java -version
          xcodebuild -version
          cmake --version
          python3 -c 'import os,platform; assert platform.machine() == ("arm64" if os.environ["EXPECTED_ARCH"] == "arm64" else "x86_64")'
          file "$JAVA_HOME/bin/java"
          chmod +x gradlew
      - name: Compile and run shared and desktop tests
        run: |
          set -o pipefail
          ./gradlew :shared:jvmTest :sharedUi:jvmTest :desktopApp:test --stacktrace 2>&1 | tee macos-tests.log
      - name: Create bundled application
        run: |
          set -o pipefail
          ./gradlew :desktopApp:createDistributable --stacktrace 2>&1 | tee macos-app.log
      - name: Build DMG
        run: |
          set -o pipefail
          ./gradlew :desktopApp:packageDmg --stacktrace 2>&1 | tee macos-dmg.log
      - name: Build PKG
        run: |
          set -o pipefail
          ./gradlew :desktopApp:packagePkg --stacktrace 2>&1 | tee macos-pkg.log
      - name: Collect installers even if a later check fails
        if: always()
        env:
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p macos-artifacts
          python3 - <<'PY'
          import os, pathlib, shutil
          for extension in ('dmg', 'pkg'):
              files = list(pathlib.Path('desktopApp/build/compose/binaries/main').glob(f'{extension}/*.{extension}'))
              if len(files) == 1:
                  shutil.copy2(files[0], f'macos-artifacts/BitChord-Revived-macOS-{os.environ["BUILD_ARCH"]}.{extension}')
          PY
      - name: Verify app and native architecture; execute bundled native smoke
        env:
          BUILD_ARCH: ${{ matrix.arch }}
        run: python3 desktopApp/packaging/macos/verify-bundle.py
      - name: GUI startup smoke (requires a visible window)
        run: python3 desktopApp/packaging/macos/smoke-startup.py
      - name: Upload installers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BitChord-Revived-macOS-${{ matrix.arch }}
          path: macos-artifacts/
          if-no-files-found: warn
      - name: Upload test and build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macOS-diagnostics-${{ matrix.arch }}
          path: |
            macos-*.log
            desktopApp/build/reports/tests/
            desktopApp/build/test-results/
            shared/build/reports/tests/
            sharedUi/build/reports/tests/
      - name: Failure summary
        if: failure()
        run: |
          python3 - <<'PY'
          import os,pathlib
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              for path in pathlib.Path('.').glob('macos-*.log'):
                  out.write('\n### '+path.name+'\n```text\n'+ '\n'.join(path.read_text(errors='replace').splitlines()[-100:])+'\n```\n')
          PY
