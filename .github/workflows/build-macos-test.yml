name: Build Test macOS

on:
  workflow_dispatch:
  pull_request:
    branches: [integration/v1.8.4]
  push:
    branches: [integration/v1.8.4, feature/macos-desktop-support-1.8.4]

permissions:
  contents: read
concurrency:
  group: macos-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS · ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            java: aarch64
          - runner: macos-15-intel
            arch: x64
            java: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          architecture: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Validate native build environment
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          uname -m
          sw_vers
          java -version
          xcodebuild -version
          cmake --version
          python3 -c 'import os,platform; assert platform.machine() == ("arm64" if os.environ["EXPECTED_ARCH"] == "arm64" else "x86_64")'
          file "$JAVA_HOME/bin/java"
          chmod +x gradlew
      - name: Create isolated unlocked test keychain
        run: bash desktopApp/packaging/macos/ci-keychain.sh setup
      - name: Compile and run shared and desktop tests
        run: |
          set -o pipefail
          ./gradlew --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process :shared:jvmTest :sharedUi:jvmTest :desktopApp:test --stacktrace 2>&1 | tee macos-tests.log
      - name: Create bundled application
        run: |
          set -o pipefail
          ./gradlew --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process :desktopApp:createDistributable --stacktrace 2>&1 | tee macos-app.log
      - name: Build DMG
        run: |
          set -o pipefail
          ./gradlew --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process :desktopApp:packageDmg --stacktrace 2>&1 | tee macos-dmg.log
      - name: Build PKG
        run: |
          set -o pipefail
          ./gradlew --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process :desktopApp:packagePkg --stacktrace 2>&1 | tee macos-pkg.log
      - name: Collect installers even if a later check fails
        if: always()
        env:
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p macos-artifacts
          python3 - <<'PY'
          import os, pathlib, shutil
          for extension in ('dmg', 'pkg'):
              files = list(pathlib.Path('desktopApp/build/compose/binaries/main').glob(f'{extension}/*.{extension}'))
              if len(files) == 1:
                  shutil.copy2(files[0], f'macos-artifacts/BitChord-Revived-macOS-{os.environ["BUILD_ARCH"]}.{extension}')
          PY
      # A packaged launcher has a different identity from the Gradle test JVM.
      # Fresh storage avoids a cross-identity Keychain permission dialog during GUI smoke.
      - name: Reset test keychain for packaged launch
        run: bash desktopApp/packaging/macos/ci-keychain.sh reset
      - name: Verify app and native architecture; execute bundled native smoke
        env:
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          set -o pipefail
          python3 desktopApp/packaging/macos/verify-bundle.py 2>&1 | tee macos-verify.log
      - name: GUI startup smoke (requires a visible window)
        run: |
          set -o pipefail
          python3 desktopApp/packaging/macos/smoke-startup.py 2>&1 | tee macos-gui.log
      - name: Upload installers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BitChord-Revived-macOS-${{ matrix.arch }}
          path: macos-artifacts/
          if-no-files-found: warn
      - name: Upload test and build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macOS-diagnostics-${{ matrix.arch }}
          path: |
            macos-*.log
            desktopApp/build/reports/tests/
            desktopApp/build/test-results/
            shared/build/reports/tests/
            sharedUi/build/reports/tests/
      - name: Remove disposable test keychain
        if: always()
        run: bash desktopApp/packaging/macos/ci-keychain.sh cleanup
      - name: Failure summary
        if: failure()
        run: |
          python3 - <<'PY'
          import os,pathlib,re,xml.etree.ElementTree as ET
          emitted = 0
          for path in pathlib.Path('.').glob('macos-*.log'):
              lines = path.read_text(errors='replace').splitlines()
              if '* What went wrong:' in lines:
                  index = lines.index('* What went wrong:')
                  detail = ' | '.join(lines[index+1:index+13]).replace('%', '%25')
                  print('::error title=Gradle failure::' + detail[:2500])
              for line in lines:
                  if emitted < 12 and (line.startswith('e: ') or line.startswith('  Line ') or line.startswith('CMake Error') or 'error:' in line.lower()):
                      escaped = line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                      print('::error title=macOS build diagnostic::' + escaped[:1500])
                      emitted += 1
          for path in pathlib.Path('.').glob('*/build/test-results/**/TEST-*.xml'):
              for case in ET.parse(path).getroot().iter('testcase'):
                  for failure in list(case):
                      if emitted < 20 and failure.tag in ('failure', 'error'):
                          message = case.get('classname', '') + '.' + case.get('name', '') + ': ' + failure.get('message', '')
                          print('::error title=macOS test failure::' + message[:1500].replace('%', '%25').replace('\n', '%0A').replace('\r', '%0D'))
                          emitted += 1
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              for path in pathlib.Path('.').glob('macos-*.log'):
                  out.write('\n### '+path.name+'\n```text\n'+ '\n'.join(path.read_text(errors='replace').splitlines()[-100:])+'\n```\n')
          PY

  windows-regression:
    name: Windows EXE, MSI and portable regression
    uses: ./.github/workflows/build-windows-portable.yml
    with:
      version: "1.8.4-macos-ci"
      installers: true

  linux-regression:
    name: Linux AppImage and native package regression
    uses: ./.github/workflows/build-test-appimage.yml
    with:
      version: "1.8.4-macos-ci"
      run_tests: true
      audit_packages: true
