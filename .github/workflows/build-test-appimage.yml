name: Build tes Appimage

# One-click portable Linux build from the branch selected in Actions.
# This workflow does NOT publish a release or modify the AUR.
on:
  workflow_call:
    inputs:
      version:
        type: string
        default: "1.8.5-updater-ci"
      run_tests:
        type: boolean
        default: true
      audit_packages:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      version:
        description: "Label for the portable test AppImage (e.g. 1.8.2-test)"
        required: false
        type: string
        default: "1.8.2-test"
      run_tests:
        description: "Run shared and desktop tests before building"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: test-appimage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: Portable AppImage for CachyOS / Linux
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Validate build label
        id: meta
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-1.8.2-test}"
          if [[ ! "$version" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$ ]]; then
            echo "::error::Version label may only contain letters, digits, '.', '_' and '-' (max 64 characters)."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building portable BitChord $version from $GITHUB_REF_NAME"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        shell: bash
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        run: |
          printf 'LASTFM_API_KEY=%s\n' "$LASTFM_API_KEY" > local.properties
          printf 'LASTFM_SECRET=%s\n' "$LASTFM_SECRET" >> local.properties

      # Restore a verified packaging binary before trying the network. A regular
      # cache action saves only at the end of a successful job; on #173 the tool
      # downloaded correctly, but the later packaging error prevented caching.
      # Split restore/save so successful downloads survive subsequent failures.
      - name: Restore verified AppImage tool cache
        id: appimagetool-cache
        uses: actions/cache/restore@v4
        with:
          path: appimagetool.AppImage
          key: appimagetool-x86_64-verified-stable-v2

      - name: Download and verify AppImage packaging tool
        shell: bash
        run: |
          set -euo pipefail
          expected_191="ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0"
          # 1.9.0 fallback digest recorded by successful download in CI #173.
          expected_190="46fdd785094c7f6e545b61afcfb0f3d98d8eab243f644b4b17698c01d06083d1"
          # Additional pinned official release, if both stable release assets
          # are temporarily unavailable through GitHub's downloads CDN.
          expected_continuous="e8c1169c4af66c3184d7ee110713d4be04befe671fa358e2c1591ee840553b03"
          tool_path="appimagetool.AppImage"

          checksum_valid() {
            local sha
            [[ -s "$1" ]] || return 1
            sha="$(sha256sum "$1" | cut -d ' ' -f 1)"
            [[ "$sha" == "$expected_191" || "$sha" == "$expected_190" || "$sha" == "$expected_continuous" ]]
          }
          valid_appimage() {
            [[ "$(wc -c < "$1")" -ge 10000000 ]] &&
              [[ "$(od -An -tx1 -j8 -N3 "$1" | tr -d '[:space:]')" == "414902" ]]
          }

          if checksum_valid "$tool_path" && valid_appimage "$tool_path"; then
            echo "Reusing checksum-verified cached appimagetool"
          else
            rm -f "$tool_path"
            urls=(
              # The GitHub Releases *API* asset endpoint can stream bytes or
              # redirect to object storage, independently of the /download URL
              # which intermittently returned HTTP 504 on CI runs #172/#174.
              "https://api.github.com/repos/AppImage/appimagetool/releases/assets/324406736"
              "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage"
              "https://api.github.com/repos/AppImage/appimagetool/releases/assets/184558942"
              "https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-x86_64.AppImage"
              "https://api.github.com/repos/AppImage/appimagetool/releases/assets/715388534"
            )
            digests=(
              "$expected_191" "$expected_191"
              "$expected_190" "$expected_190"
              "$expected_continuous"
            )
            tmp="$(mktemp)"
            trap 'rm -f "$tmp"' EXIT
            for idx in "${!urls[@]}"; do
              url="${urls[$idx]}"
              rm -f "$tmp"
              curl_args=(
                --fail --location --silent --show-error
                --connect-timeout 20 --max-time 120
                --retry 2 --retry-all-errors --retry-delay 3
              )
              if [[ "$url" == https://api.github.com/* ]]; then
                curl_args+=(--header "Accept: application/octet-stream"
                            --header "X-GitHub-Api-Version: 2022-11-28")
              fi
              echo "Trying appimagetool source $((idx + 1))/${#urls[@]}"
              if curl "${curl_args[@]}" --output "$tmp" "$url"; then
                if valid_appimage "$tmp" &&
                   echo "${digests[$idx]}  $tmp" | sha256sum --check --status; then
                  mv "$tmp" "$tool_path"
                  echo "Accepted and SHA-256 verified appimagetool source $((idx + 1))"
                  break
                fi
                echo "::warning::Rejected non-AppImage or checksum mismatch from source $((idx + 1))"
              else
                echo "::warning::Download source $((idx + 1)) unavailable; trying the next source"
              fi
            done
            if ! checksum_valid "$tool_path" || ! valid_appimage "$tool_path"; then
              echo "::error::All verified appimagetool sources failed (GitHub asset API and release URLs)"
              exit 1
            fi
          fi
          chmod +x "$tool_path" gradlew desktopApp/packaging/appimage.sh
          sha256sum "$tool_path"

      # Save immediately after a validated download, not at the end of the
      # entire packaging job, so unrelated packaging/tests cannot erase the cache.
      - name: Save verified AppImage tool cache
        if: steps.appimagetool-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: appimagetool.AppImage
          key: appimagetool-x86_64-verified-stable-v2

      # appimagetool 1.9.x invokes desktop-file-validate while packaging.
      # The Ubuntu 22.04 runner does not guarantee that binary is preinstalled.
      # Required for both the manual AppImage build and updater audit workflow.
      - name: Install AppImage desktop-entry validator
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends desktop-file-utils
          command -v desktop-file-validate

      - name: Native package tools for updater audit
        if: ${{ inputs.audit_packages }}
        run: |
          sudo apt-get install -y rpm fakeroot

      - name: Run tests
        if: ${{ inputs.run_tests }}
        run: xvfb-run -a ./gradlew :shared:jvmTest :sharedUi:jvmTest :desktopApp:test "-Pbitchord.version=${{ steps.meta.outputs.version }}"

      # Manual quick builds wrap jpackage once; the reusable audit also checks native packages.
      - name: Build portable Linux application
        run: ./gradlew :desktopApp:createDistributable "-Pbitchord.version=${{ steps.meta.outputs.version }}" --build-cache

      - name: Build and inspect DEB/RPM for updater audit
        if: ${{ inputs.audit_packages }}
        shell: bash
        env:
          BUILD_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          ./gradlew :desktopApp:packageDeb :desktopApp:packageRpm "-Pbitchord.version=$BUILD_VERSION"
          dpkg-deb -f desktopApp/build/compose/binaries/main/deb/*.deb Package Version Architecture
          rpm -qp --queryformat '%{NAME} %{VERSION} %{ARCH}\n' desktopApp/build/compose/binaries/main/rpm/*.rpm

      - name: Check native libraries and bundled models
        shell: bash
        run: |
          set -euo pipefail
          jar_file=$(find desktopApp/build/compose/binaries/main/app/BitChord/lib/app \
            -maxdepth 1 -type f -name 'desktopApp*.jar' -print -quit)
          test -n "$jar_file"
          jar tf "$jar_file" > "$RUNNER_TEMP/desktop-jar-contents.txt"
          grep -Fq 'native/libbitchord_analysis.so' "$RUNNER_TEMP/desktop-jar-contents.txt"
          grep -Eq '^models/.*\.onnx$' "$RUNNER_TEMP/desktop-jar-contents.txt"

      - name: Validate packaged AutoMix analyser with real JNI calls
        shell: bash
        run: bash desktopApp/packaging/tests/linux-automix-check.sh

      - name: Build AppImage
        shell: bash
        run: |
          set -euo pipefail
          desktopApp/packaging/appimage.sh \
            desktopApp/build/compose/binaries/main/app/BitChord \
            "dist/BitChord-${{ steps.meta.outputs.version }}-linux-x86_64.AppImage" \
            "$PWD/appimagetool.AppImage"

      - name: Verify portable AppImage without FUSE
        shell: bash
        run: |
          set -euo pipefail
          appimage="dist/BitChord-${{ steps.meta.outputs.version }}-linux-x86_64.AppImage"
          test -s "$appimage"
          chmod +x "$appimage"
          "$appimage" --appimage-extract > /dev/null
          test -x squashfs-root/AppRun
          test -x squashfs-root/usr/bin/BitChord
          test -f squashfs-root/bitchord.desktop
          test -f squashfs-root/bitchord.png
          bash desktopApp/packaging/tests/linux-automix-check.sh squashfs-root/usr
          sha256sum "$appimage"
          ls -lh "$appimage"

      - name: Actual AppImage updater GUI and recovery tests
        shell: bash
        env:
          BUILD_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          xvfb-run -a python3 desktopApp/packaging/tests/appimage-relaunch.py \
            "dist/BitChord-$BUILD_VERSION-linux-x86_64.AppImage" --output "$RUNNER_TEMP/updater-appimage"
          echo "AppImage replacement/relaunch/recovery GUI tests passed (extract-and-run); inspect results.json for FUSE runtime coverage." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload CachyOS portable AppImage
        uses: actions/upload-artifact@v4
        with:
          name: BitChord-CachyOS-AppImage-${{ steps.meta.outputs.version }}
          path: dist/*.AppImage
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: appimage-test-reports
          path: |
            desktopApp/build/reports/tests/
            shared/build/reports/tests/
            ${{ runner.temp }}/updater-appimage/results.json
            ${{ runner.temp }}/updater-appimage/**/install.log
            ${{ runner.temp }}/updater-appimage/**/status
            ${{ runner.temp }}/updater-appimage/**/after.png
          if-no-files-found: ignore
