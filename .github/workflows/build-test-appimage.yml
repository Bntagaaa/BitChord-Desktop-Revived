name: Build tes Appimage

# One-click portable Linux build from the branch selected in Actions.
# This workflow does NOT publish a release or modify the AUR.
on:
  workflow_call:
    inputs:
      version:
        type: string
        default: "1.8.5-updater-ci"
      run_tests:
        type: boolean
        default: true
      audit_packages:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      version:
        description: "Label for the portable test AppImage (e.g. 1.8.2-test)"
        required: false
        type: string
        default: "1.8.2-test"
      run_tests:
        description: "Run shared and desktop tests before building"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: test-appimage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: Portable AppImage for CachyOS / Linux
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Validate build label
        id: meta
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-1.8.2-test}"
          if [[ ! "$version" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$ ]]; then
            echo "::error::Version label may only contain letters, digits, '.', '_' and '-' (max 64 characters)."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building portable BitChord $version from $GITHUB_REF_NAME"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        shell: bash
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        run: |
          printf 'LASTFM_API_KEY=%s\n' "$LASTFM_API_KEY" > local.properties
          printf 'LASTFM_SECRET=%s\n' "$LASTFM_SECRET" >> local.properties

      - name: Download AppImage packaging tool
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --silent --show-error \
            -o appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage
          chmod +x gradlew desktopApp/packaging/appimage.sh

      - name: Native package tools for updater audit
        if: ${{ inputs.audit_packages }}
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot

      - name: Run tests
        if: ${{ inputs.run_tests }}
        run: xvfb-run -a ./gradlew :shared:jvmTest :sharedUi:jvmTest :desktopApp:test "-Pbitchord.version=${{ steps.meta.outputs.version }}"

      # Manual quick builds wrap jpackage once; the reusable audit also checks native packages.
      - name: Build portable Linux application
        run: ./gradlew :desktopApp:createDistributable "-Pbitchord.version=${{ steps.meta.outputs.version }}" --build-cache

      - name: Build and inspect DEB/RPM for updater audit
        if: ${{ inputs.audit_packages }}
        shell: bash
        env:
          BUILD_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          ./gradlew :desktopApp:packageDeb :desktopApp:packageRpm "-Pbitchord.version=$BUILD_VERSION"
          dpkg-deb -f desktopApp/build/compose/binaries/main/deb/*.deb Package Version Architecture
          rpm -qp --queryformat '%{NAME} %{VERSION} %{ARCH}\n' desktopApp/build/compose/binaries/main/rpm/*.rpm

      - name: Check native libraries and bundled models
        shell: bash
        run: |
          set -euo pipefail
          jar_file=$(find desktopApp/build/compose/binaries/main/app/BitChord/lib/app \
            -maxdepth 1 -type f -name 'desktopApp*.jar' -print -quit)
          test -n "$jar_file"
          jar tf "$jar_file" > "$RUNNER_TEMP/desktop-jar-contents.txt"
          grep -Fq 'native/libbitchord_analysis.so' "$RUNNER_TEMP/desktop-jar-contents.txt"
          grep -Eq '^models/.*\.onnx$' "$RUNNER_TEMP/desktop-jar-contents.txt"

      - name: Build AppImage
        shell: bash
        run: |
          set -euo pipefail
          desktopApp/packaging/appimage.sh \
            desktopApp/build/compose/binaries/main/app/BitChord \
            "dist/BitChord-${{ steps.meta.outputs.version }}-linux-x86_64.AppImage" \
            "$PWD/appimagetool.AppImage"

      - name: Verify portable AppImage without FUSE
        shell: bash
        run: |
          set -euo pipefail
          appimage="dist/BitChord-${{ steps.meta.outputs.version }}-linux-x86_64.AppImage"
          test -s "$appimage"
          chmod +x "$appimage"
          "$appimage" --appimage-extract > /dev/null
          test -x squashfs-root/AppRun
          test -x squashfs-root/usr/bin/BitChord
          test -f squashfs-root/bitchord.desktop
          test -f squashfs-root/bitchord.png
          sha256sum "$appimage"
          ls -lh "$appimage"

      - name: Actual AppImage updater GUI and recovery tests
        shell: bash
        env:
          BUILD_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          xvfb-run -a python3 desktopApp/packaging/tests/appimage-relaunch.py \
            "dist/BitChord-$BUILD_VERSION-linux-x86_64.AppImage" --output "$RUNNER_TEMP/updater-appimage"
          echo "AppImage replacement/relaunch/recovery GUI tests passed (extract-and-run); inspect results.json for FUSE runtime coverage." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload CachyOS portable AppImage
        uses: actions/upload-artifact@v4
        with:
          name: BitChord-CachyOS-AppImage-${{ steps.meta.outputs.version }}
          path: dist/*.AppImage
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: appimage-test-reports
          path: |
            desktopApp/build/reports/tests/
            shared/build/reports/tests/
            ${{ runner.temp }}/updater-appimage/results.json
            ${{ runner.temp }}/updater-appimage/**/install.log
            ${{ runner.temp }}/updater-appimage/**/status
            ${{ runner.temp }}/updater-appimage/**/after.png
          if-no-files-found: ignore
