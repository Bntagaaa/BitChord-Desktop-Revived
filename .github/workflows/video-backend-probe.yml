name: Video backend probe

on:
  pull_request:
    paths:
      - '.github/workflows/video-backend-probe.yml'
      - 'tools/video-backend-probe/**'
      - 'desktopApp/src/test/kotlin/com/music/bitchord/desktop/DesktopGStreamerOverlayProbeTest.kt'

permissions:
  contents: read

jobs:
  headless-probe:
    name: GStreamer software decode · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shell: bash
          - os: windows-latest
            shell: msys2 {0}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build and probe dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-libav ffmpeg
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          update: true
          pacboy: >-
            gcc:p
            pkgconf:p
            gst-plugins-base:p
            gst-plugins-good:p
            gst-plugins-bad:p
            gst-libav:p
      - name: Build and smoke-test decoder lifecycle
        shell: ${{ matrix.shell }}
        env:
          CC: gcc
        run: |
          set -euo pipefail
          bash tools/video-backend-probe/prepare.sh video-probe-build
          probe=video-probe-build/gstreamer-probe
          if [[ -f "$probe.exe" ]]; then probe="$probe.exe"; fi
          "$probe" headless-cpu video-probe-build/cycles.mp4 3 | tee video-probe-build/probe.log
          test "$(grep -c '^cycle=.* rendered=30 dropped=0 ' video-probe-build/probe.log)" -eq 3
          set +e
          "$probe" headless-cpu video-probe-build/missing.mp4 1 > video-probe-build/missing.log 2>&1
          status=$?
          set -e
          cat video-probe-build/missing.log
          test "$status" -eq 1
          grep -q 'rendered=0' video-probe-build/missing.log
