name: Temporary Dart formatter snapshot
on:
  push:
    branches: [2.0.0-flutter]
    paths: ['.github/workflows/format-snapshot.yml']
permissions:
  contents: read
jobs:
  format-reviewed-files:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Emit machine-readable formatter result for reviewed source files
        working-directory: flutterDesktop
        run: |
          dart format lib/features/online/domain/catalog.dart lib/features/online/data/youtube_resolver.dart lib/features/online/data/online_runtime.dart lib/features/online/data/recording_fallback.dart lib/features/online/presentation/catalog_surface.dart tool/phase4_youtube_contracts.dart
          python - <<'PY'
          import json
          from pathlib import Path
          for path in (
              'lib/features/online/domain/catalog.dart',
              'lib/features/online/data/youtube_resolver.dart',
              'lib/features/online/data/online_runtime.dart',
              'lib/features/online/data/recording_fallback.dart',
              'lib/features/online/presentation/catalog_surface.dart',
              'tool/phase4_youtube_contracts.dart',
          ):
              print('FORMAT_SNAPSHOT=' + json.dumps({
                  'path': 'flutterDesktop/' + path,
                  'content': Path(path).read_text(),
              }, separators=(',', ':')))
          PY
