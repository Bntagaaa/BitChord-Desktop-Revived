name: Phase 4 SDK-aligned one-time Dart formatter

on:
  push:
    branches: [2.0.0-flutter]
    paths:
      - '.github/workflows/phase4-format-once.yml'

permissions:
  contents: write
  actions: write

jobs:
  format-only:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Format with project Dart 3.11 and check exactly like release CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd flutterDesktop
          flutter pub get --enforce-lockfile
          dart format --language-version=3.11 lib test
          dart format --output=none --set-exit-if-changed lib test
          cd ..
          git rm -- .github/workflows/phase4-format-once.yml
          git add flutterDesktop/lib flutterDesktop/test
          git -c user.name="BitChord Phase4 Formatter" -c user.email="actions@users.noreply.github.com" commit -m "style(phase4): align all Dart files with package language 3.11"
          git push origin HEAD:2.0.0-flutter
          gh workflow run flutter-desktop.yml --ref 2.0.0-flutter
