name: Phase 4 one-time Dart formatter

on:
  push:
    branches: [2.0.0-flutter]
    paths:
      - '.github/workflows/phase4-format-once.yml'

permissions:
  contents: write

jobs:
  format-only:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Apply official Dart formatter and remove this one-time job
        shell: bash
        run: |
          set -euo pipefail
          cd flutterDesktop
          dart format lib test
          cd ..
          git rm -- .github/workflows/phase4-format-once.yml
          git add flutterDesktop/lib flutterDesktop/test
          git -c user.name="BitChord Phase4 Formatter" -c user.email="actions@users.noreply.github.com" commit -m "style(phase4): apply official Dart formatter"
          git push origin HEAD:2.0.0-flutter
