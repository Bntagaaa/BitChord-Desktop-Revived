name: GPU video renderer CI

on:
  pull_request:
    branches:
      - 1.9.3-phase-1
    paths:
      - "desktopApp/**"
      - ".github/workflows/gpu-video-ci.yml"
  workflow_dispatch:

jobs:
  compile-desktop:
    name: Compile desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    env:
      BITCHORD_DESKTOP_ONLY: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile Kotlin desktop and resolve native runtime
        shell: bash
        run: |
          ./gradlew :desktopApp:compileKotlin --no-daemon --stacktrace
      # The video renderer uses packaged libmpv natives, not BitChord's optional
      # C++ Automix analyser / Win32 window bridge. These have their own release
      # CI; building them here can fail on a runner's mismatched MinGW/CMake
      # toolchain even after the GPU Kotlin compilation succeeds.
      - name: Run desktop unit tests (skip unrelated native C++ builds)
        shell: bash
        run: |
          ./gradlew :desktopApp:test \
            -x :desktopApp:buildAnalysisNative \
            -x :desktopApp:buildWindowNative \
            --no-daemon --stacktrace
      - name: Verify Windows portable classpath and video runtime
        if: runner.os == 'Windows'
        shell: bash
        run: |
          ./gradlew :desktopApp:windowsPortable \
            -x :desktopApp:buildAnalysisNative \
            -x :desktopApp:buildWindowNative \
            --no-daemon --stacktrace
      - name: Upload experimental Windows portable build
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: BitChord-GPU-video-windows-portable
          path: desktopApp/build/distributions/*windows-portable.zip
          if-no-files-found: error
          retention-days: 7
