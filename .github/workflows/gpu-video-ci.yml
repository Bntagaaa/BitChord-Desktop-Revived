name: GPU video renderer CI

on:
  pull_request:
    branches:
      - 1.9.3-phase-1
    paths:
      - "desktopApp/**"
      - ".github/workflows/gpu-video-ci.yml"
  workflow_dispatch:

jobs:
  compile-desktop:
    name: Compile desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    env:
      BITCHORD_DESKTOP_ONLY: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile Kotlin desktop and resolve native runtime
        shell: bash
        run: |
          ./gradlew :desktopApp:compileKotlin --no-daemon --stacktrace
      - name: Run desktop unit tests
        shell: bash
        run: |
          ./gradlew :desktopApp:test --no-daemon --stacktrace
