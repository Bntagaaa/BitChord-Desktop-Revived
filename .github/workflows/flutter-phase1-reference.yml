name: Phase 1 pinned Kotlin reference validation

on:
  workflow_dispatch:
  push:
    branches: [2.0.0-flutter]
    paths: ['.github/workflows/flutter-phase1-reference.yml', 'flutterDesktop/tool/reference_msvc.init.gradle', 'flutterDesktop/tool/launch_smoke_windows.ps1', 'flutterDesktop/tool/SeedReferenceProfile.java']

permissions:
  contents: read

jobs:
  reference:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
        working-directory: reference
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 348b613a0c3db1a54de56483ea6f8748d6465211
          path: reference
          persist-credentials: false
      - name: Record immutable reference and environment
        run: |
          test "$(git rev-parse HEAD)" = 348b613a0c3db1a54de56483ea6f8748d6465211
          mkdir -p verification
          git rev-parse HEAD > verification/reference-sha.txt
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: runner.os == 'Windows'
        with:
          path: migration-tools
          sparse-checkout: |
            flutterDesktop/tool/reference_msvc.init.gradle
            flutterDesktop/tool/launch_smoke_windows.ps1
            flutterDesktop/tool/SeedReferenceProfile.java
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Diagnose Windows native configuration with the reference toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = (Get-Command g++.exe).Source
          $ninja = (Get-Command ninja.exe).Source
          cmake --version
          & $compiler --version
          & $ninja --version
          cmake -S desktopApp/native -B desktopApp/build/native/windows -G Ninja "-DCMAKE_MAKE_PROGRAM=$ninja" "-DCMAKE_CXX_COMPILER=$compiler" -DCMAKE_BUILD_TYPE=Release 2>&1 | Tee-Object verification/native-configure.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test pinned reference without source changes or credentials
        if: success() || failure()
        run: |
          set -euo pipefail
          java -version 2>&1 | tee verification/java.log
          display=()
          if [ "$RUNNER_OS" = Linux ]; then display=(xvfb-run -a); fi
          native_tools=()
          if [ "$RUNNER_OS" = Windows ]; then native_tools=(-I ../migration-tools/flutterDesktop/tool/reference_msvc.init.gradle); fi
          "${display[@]}" bash gradlew "${native_tools[@]}" :shared:jvmTest :sharedUi:jvmTest :desktopApp:test --no-daemon --max-workers=2 --console=plain '-Dorg.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8' 2>&1 | tee verification/tests.log
      - name: Build pinned reference for visual comparison
        if: success() || failure()
        run: |
          set -euo pipefail
          native_tools=()
          if [ "$RUNNER_OS" = Windows ]; then native_tools=(-I ../migration-tools/flutterDesktop/tool/reference_msvc.init.gradle); fi
          bash gradlew "${native_tools[@]}" :desktopApp:createDistributable --no-daemon --max-workers=2 --console=plain '-Dorg.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8' -Pbitchord.version=1.9.2 2>&1 | tee verification/build.log
      - name: Verify reference preservation
        if: always()
        run: |
          git diff --exit-code
          git status --short > verification/worktree.txt
      - name: Verify packaged Windows reference JNI and original models
        if: runner.os == 'Windows' && !cancelled()
        shell: pwsh
        run: |
          foreach ($name in @('bitchord_analysis.dll','bitchord_smtc.dll')) {
            if (-not (Test-Path "desktopApp/build/native/windows/$name")) { throw "Missing reference target $name" }
          }
          if (-not (Test-Path desktopApp/build/native-window/windows/bitchord_window.dll)) { throw 'Missing reference window/audio DLL' }
          ./desktopApp/packaging/tests/windows-automix-check.ps1
      - name: Configure hosted Windows reference display
        if: runner.os == 'Windows' && !cancelled()
        shell: powershell
        run: Set-DisplayResolution -Width 1600 -Height 1200 -Force
      - name: Capture pinned Windows reference shell with a fresh hosted profile
        if: runner.os == 'Windows' && !cancelled()
        shell: pwsh
        run: |
          $executable = (Resolve-Path desktopApp/build/compose/binaries/main/app/BitChord/BitChord.exe).Path
          java ../migration-tools/flutterDesktop/tool/SeedReferenceProfile.java $executable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ../migration-tools/flutterDesktop/tool/launch_smoke_windows.ps1 -Executable $executable -EvidenceDirectory "$pwd/verification" -OutputPrefix reference-windows -CaptureOnly -SourceCommit 348b613a0c3db1a54de56483ea6f8748d6465211
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: phase1-kotlin-reference-${{ matrix.os }}
          path: |
            reference/verification/
            reference/shared/build/test-results/
            reference/sharedUi/build/test-results/
            reference/desktopApp/build/test-results/
            reference/desktopApp/build/native/**/CMakeCache.txt
            reference/desktopApp/build/native/**/CMakeFiles/CMakeConfigureLog.yaml
            reference/desktopApp/build/native-window/**/CMakeCache.txt
            reference/desktopApp/build/native-window/**/CMakeFiles/CMakeConfigureLog.yaml
            reference/desktopApp/build/compose/binaries/main/app/
          if-no-files-found: error
