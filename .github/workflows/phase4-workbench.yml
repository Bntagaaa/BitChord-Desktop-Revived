name: Phase 4 validation workbench
on:
  push:
    branches: [2.0.0-flutter]
    paths: ['.github/workflows/phase4-workbench.yml']
permissions:
  contents: read
jobs:
  context:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Export complete cross-platform framework source for widget tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, zipfile
          sdk=Path(os.environ['FLUTTER_ROOT'])
          with zipfile.ZipFile('phase4-sdk-source-supplement.zip','w',zipfile.ZIP_DEFLATED) as z:
              for path in (sdk/'packages').rglob('*'):
                  if path.is_file() and not path.is_symlink() and 'android' in str(path.relative_to(sdk)):
                      z.write(path,'flutter/'+str(path.relative_to(sdk)))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase4-sdk-source-supplement
          path: phase4-sdk-source-supplement.zip
          retention-days: 3
