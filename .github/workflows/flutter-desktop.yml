name: Flutter desktop foundation

on:
  workflow_dispatch:
  push:
    branches: [2.0.0-flutter, agy/phase4-auth-audio, codex/visual-parity]
    paths: ['flutterDesktop/**', '.github/workflows/flutter-desktop.yml', 'AGENTS.md', '.codex/phases/**', 'FUNCTIONAL_RELIABILITY_REPORT.md']
  pull_request:
    branches: [2.0.0-flutter]
    paths: ['flutterDesktop/**', '.github/workflows/flutter-desktop.yml', 'AGENTS.md', '.codex/phases/**', 'FUNCTIONAL_RELIABILITY_REPORT.md']

permissions:
  contents: read

concurrency:
  group: flutter-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux
          - os: windows-2022
            target: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
        working-directory: flutterDesktop
    env:
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      DART_SUPPRESS_ANALYTICS: 'true'
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Brainicism/bgutil-ytdlp-pot-provider
          ref: 26475e9d3665b972c4aeb83b4dbaafcf64b88438 # tag 2.0.2
          path: .youtube-po-provider
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.5'
          architecture: x64
      - name: Install Linux desktop dependencies from official repositories
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: python tool/run_checked.py apt-setup python tool/install_linux_ci.py
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: runner.os == 'Windows'
        with:
          repository: microsoft/vcpkg
          ref: ef7dbf94b9198bc58f45951adcf1f041fcbc5ea0
          path: .native-vcpkg
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: runner.os == 'Windows'
        with:
          path: ${{ runner.temp }}/bitchord-vcpkg-cache
          key: native-windows-release-v2-${{ hashFiles('flutterDesktop/native/audio/vcpkg.json') }}
      - name: Configure native binary cache
        if: runner.os == 'Windows'
        run: |
          mkdir -p "$RUNNER_TEMP/bitchord-vcpkg-cache"
          echo "VCPKG_BINARY_SOURCES=clear;files,$RUNNER_TEMP/bitchord-vcpkg-cache,readwrite" >> "$GITHUB_ENV"
      - name: Build pinned LGPL native dependencies on Windows
        if: runner.os == 'Windows'
        timeout-minutes: 50
        run: |
          "$GITHUB_WORKSPACE/.native-vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          "$GITHUB_WORKSPACE/.native-vcpkg/vcpkg.exe" install --triplet x64-windows-release --overlay-triplets="$GITHUB_WORKSPACE/flutterDesktop/native/audio/triplets" --x-manifest-root="$GITHUB_WORKSPACE/flutterDesktop/native/audio" --x-install-root="$RUNNER_TEMP/bitchord-deps"
          echo "BC_DEPENDENCY_ROOT=$RUNNER_TEMP/bitchord-deps/x64-windows-release" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$RUNNER_TEMP/bitchord-deps/x64-windows-release" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/bitchord-deps/x64-windows-release/bin" >> "$GITHUB_PATH"
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: runner.os == 'Windows'
        with:
          path: ${{ runner.temp }}/bitchord-vcpkg-cache
          key: native-windows-release-v2-${{ hashFiles('flutterDesktop/native/audio/vcpkg.json') }}
      - name: Configure, build and test real native PCM foundation
        run: |
          python tool/run_checked.py native-configure cmake -S native/audio -B build/native -DCMAKE_BUILD_TYPE=Release
          python tool/run_checked.py native-build cmake --build build/native --config Release --parallel 2
          python tool/run_checked.py native-tests ctest --test-dir build/native -C Release --output-on-failure
          python tool/run_checked.py native-platform python tool/phase3_platform.py
      - name: Generate official platform hosts and record SDK provenance
        run: |
          mkdir -p verification
          python tool/run_checked.py doctor flutter doctor -v
          python tool/run_checked.py initialize python tool/initialize_platforms.py
          python tool/run_checked.py audio-host python tool/integrate_audio_host.py
          python tool/run_checked.py boundaries python tool/check_boundaries.py
          python tool/run_checked.py reference python tool/verify_reference_tokens.py
          git fetch --no-tags --depth=1 origin 348b613a0c3db1a54de56483ea6f8748d6465211
          python tool/run_checked.py phase2-reference python tool/phase2_reference.py --check
      - name: Resolve dependencies
        run: |
          if [ -f pubspec.lock ]; then
            python tool/run_checked.py dependencies flutter pub get --enforce-lockfile
          else
            python tool/run_checked.py dependencies flutter pub get
          fi
          python tool/run_checked.py patch-deps python tool/patch_dependencies.py
      # Verified source must already be formatted; CI must not silently
      # rewrite submitted application code before checking or building it.
      - name: Check Dart formatting
        run: |
          python tool/run_checked.py format dart format lib test
      - name: Check real FFI, transactional import and queue corpus
        run: |
          python tool/run_checked.py kotlin-import python tool/test_kotlin_export.py
          python tool/run_checked.py phase3-ffi dart run tool/phase3_check.dart
      - name: Check real provider HTTP, offline integrity and native source broker
        timeout-minutes: 3
        run: python tool/run_checked.py phase4-http python tool/phase4_platform.py
      - name: Analyze
        run: python tool/run_checked.py analyze flutter analyze --fatal-infos
      - name: Run tests and capture rendered shell
        timeout-minutes: 10
        env:
          BITCHORD_CAPTURE: '1'
        run: |
          set -euo pipefail
          python tool/run_checked.py tests flutter test --machine | tee verification/tests.json
      - name: Build release desktop bundle
        run: python tool/run_checked.py build flutter build ${{ matrix.target }} --release
      - name: Build self-contained YouTube PO Token runtime (no user setup)
        timeout-minutes: 15
        run: |
          cd "$GITHUB_WORKSPACE/.youtube-po-provider/server"
          npm ci --no-audit --no-fund
          npx tsc
          npm prune --omit=dev --ignore-scripts --no-audit --no-fund
          cd "$GITHUB_WORKSPACE/flutterDesktop"
          python tool/run_checked.py youtube-bundle python tool/package_youtube_runtime.py ${{ matrix.target }} "$GITHUB_WORKSPACE/.youtube-po-provider"
      - name: Observe anonymous bundled YouTube media access (non-gating)
        if: runner.os == 'Linux'
        continue-on-error: true
        timeout-minutes: 4
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import subprocess
          try:
              result = subprocess.run(
                  ['dart', 'run', 'tool/phase4_bundled_live.dart',
                   'build/linux/x64/release/bundle'],
                  capture_output=True, text=True, timeout=210)
              lines = result.stdout.strip().splitlines()
              report = json.loads(lines[-1]) if lines else {'media': 'NO_REPORT'}
              report['probe_process_exit'] = result.returncode
          except (ValueError, subprocess.TimeoutExpired, OSError):
              report = {'media': 'PROBE_UNAVAILABLE', 'probe_process_exit': 'UNVERIFIED'}
          Path('verification/youtube-bundle-live.json').write_text(
              json.dumps(report, indent=2) + '\n')
          print(json.dumps(report))
          PY
      - name: Linux release launch smoke
        if: runner.os == 'Linux'
        timeout-minutes: 3
        run: |
          python tool/run_checked.py launch python tool/launch_smoke.py build/linux/x64/release/bundle/bitchord_desktop
      - name: Configure hosted Windows display for full-size client captures
        if: runner.os == 'Windows'
        shell: powershell
        run: Set-DisplayResolution -Width 1600 -Height 1200 -Force
      - name: Windows release launch smoke
        if: runner.os == 'Windows'
        timeout-minutes: 3
        run: python tool/run_checked.py launch pwsh -NoProfile -File tool/launch_smoke_windows.ps1 -Executable build/windows/x64/runner/Release/bitchord_desktop.exe
      - name: Package generated source for review
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          root = Path.cwd()
          with zipfile.ZipFile(root.parent / ('flutter-source-' + '${{ matrix.target }}' + '.zip'), 'w', zipfile.ZIP_DEFLATED) as archive:
              for path in root.rglob('*'):
                  relative = path.relative_to(root)
                  if path.is_symlink() or any(part in {'build', '.dart_tool', 'ephemeral', 'verification'} for part in relative.parts):
                      continue
                  if path.is_file():
                      archive.write(path, relative)
          PY
      - name: Upload validation, generated hosts and formatted source
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flutter-foundation-${{ matrix.target }}
          path: |
            flutterDesktop/verification/
            flutterDesktop/build/native/bitchord_*
            flutterDesktop/build/native/*.so
            flutterDesktop/build/native/Release/*.exe
            flutterDesktop/build/native/Release/*.dll
            flutter-source-${{ matrix.target }}.zip
            flutterDesktop/build/linux/x64/release/bundle/
            flutterDesktop/build/windows/x64/runner/Release/
          if-no-files-found: warn

  retain-verified-generation:
    # Never grant write credentials to PR validation. Retain only an exact-head
    # trusted-branch build after BOTH platforms and Linux launch have passed.
    needs: desktop
    if: github.event_name == 'push' && github.ref == 'refs/heads/2.0.0-flutter' && github.repository == 'Bntagaaa/BitChord-Desktop-Revived'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 2.0.0-flutter
      - name: Refuse to overwrite newer work
        env:
          VALIDATED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$VALIDATED_SHA"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: flutter-foundation-linux
          path: ${{ runner.temp }}/flutter-validated
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: flutter-foundation-windows
          path: ${{ runner.temp }}/flutter-validated-windows
      - name: Retain officially generated hosts, resolved lockfile and formatter output
        env:
          VALIDATED_ARTIFACT: ${{ runner.temp }}/flutter-validated/flutter-source-linux.zip
          VALIDATED_EVIDENCE: ${{ runner.temp }}/flutter-validated/flutterDesktop/verification
          WINDOWS_EVIDENCE: ${{ runner.temp }}/flutter-validated-windows/flutterDesktop/verification
          VALIDATED_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VALIDATED_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import zipfile
          root = Path('flutterDesktop')
          with zipfile.ZipFile(os.environ['VALIDATED_ARTIFACT']) as archive:
              names = archive.namelist()
              for required in ['windows/CMakeLists.txt', 'linux/CMakeLists.txt', '.metadata', 'pubspec.lock', 'tool/platform_generation.json']:
                  if required not in names:
                      raise SystemExit('Missing validated generated file: ' + required)
              provenance = json.loads(archive.read('tool/platform_generation.json'))
              if provenance['frameworkRevision'] != 'c197ca5199e9ee5661e865596c9c07294dfab51c':
                  raise SystemExit('Unexpected generator revision')
              for entry in archive.infolist():
                  relative = Path(entry.filename)
                  if relative.is_absolute() or '..' in relative.parts:
                      raise SystemExit('Unsafe archive path')
                  allowed = (relative.parts[0] in {'windows', 'linux', 'lib', 'test'} or
                             entry.filename in {'.metadata', 'pubspec.lock', 'tool/platform_generation.json'})
                  if not allowed or entry.is_dir():
                      continue
                  destination = root / relative
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(archive.read(entry))
          evidence = Path(os.environ['VALIDATED_EVIDENCE'])
          target = root / 'verification'
          target.mkdir(exist_ok=True)
          states = ['accounts', 'drawer', 'settings', 'dark', 'pitch-black', 'light']
          linux_names = ['shell-dark-1220x780.png', 'shell-dark-900x600.png', 'native-linux-1220x780.png', 'native-linux-900x600.png', 'test-summary.json', 'native-linux.json']
          linux_names += [f'native-linux-{state}-900x600.png' for state in states]
          for name in linux_names:
              data = (evidence / name).read_bytes()
              if name.endswith('.png') and not data.startswith(b'\x89PNG\r\n\x1a\n'):
                  raise SystemExit('Invalid render evidence: ' + name)
              (target / name).write_bytes(data)
          windows_evidence = Path(os.environ['WINDOWS_EVIDENCE'])
          windows_names = ['native-windows-1220x780.png', 'native-windows-900x600.png', 'native-windows.json']
          windows_names += [f'native-windows-{state}-900x600.png' for state in states]
          for name in windows_names:
              data = (windows_evidence / name).read_bytes()
              if name.endswith('.png') and not data.startswith(b'\x89PNG\r\n\x1a\n'):
                  raise SystemExit('Invalid Windows render evidence: ' + name)
              (target / name).write_bytes(data)
          (target / 'hosted-run.json').write_text(json.dumps({
              'source_commit': os.environ['VALIDATED_SHA'], 'run_url': os.environ['VALIDATED_RUN_URL'],
              'linux_job': 'success', 'windows_job': 'success', 'kotlin_visual_comparison': 'not run',
          }, indent=2) + '\n')
          PY
          git add flutterDesktop/lib flutterDesktop/test flutterDesktop/tool/platform_generation.json flutterDesktop/pubspec.lock
          git add -f flutterDesktop/windows flutterDesktop/linux flutterDesktop/.metadata
          git add -f flutterDesktop/verification/*.png flutterDesktop/verification/test-summary.json flutterDesktop/verification/hosted-run.json flutterDesktop/verification/native-linux.json flutterDesktop/verification/native-windows.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "build: retain verified Flutter generated hosts and formatting"
            git push origin HEAD:2.0.0-flutter
          fi
