name: Phase 1 Windows reference native diagnosis

on:
  workflow_dispatch:
  push:
    branches: [2.0.0-flutter]
    paths: ['.github/workflows/flutter-phase1-windows-native.yml']

permissions:
  contents: read

jobs:
  native:
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
        working-directory: reference
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 348b613a0c3db1a54de56483ea6f8748d6465211
          path: reference
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Configure immutable reference using its supported MSVC path
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force verification | Out-Null
          $sha = git rev-parse HEAD
          if ($sha -ne '348b613a0c3db1a54de56483ea6f8748d6465211') { throw 'Reference SHA differs' }
          $sha | Set-Content verification/reference-sha.txt
          cmake --version | Tee-Object verification/cmake-version.log
          cmake -S desktopApp/native -B desktopApp/build/native/windows --fresh -G 'Visual Studio 17 2022' -A x64 -DCMAKE_BUILD_TYPE=Release 2>&1 | Tee-Object verification/native-configure.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile all reference native targets with visible diagnostics
        run: |
          cmake --build desktopApp/build/native/windows --config Release --parallel 2 --verbose 2>&1 | Tee-Object verification/native-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile reference window bridge with the SDK header prerequisite
        run: |
          cmake -S desktopApp/native/window -B desktopApp/build/native-window/windows --fresh -G 'Visual Studio 17 2022' -A x64 -DCMAKE_BUILD_TYPE=Release '-DCMAKE_CXX_FLAGS=/DNOMINMAX /DWIN32_LEAN_AND_MEAN /D_WIN32_WINNT=0x0A00 /FIwindows.h /FIpropkeydef.h' 2>&1 | Tee-Object verification/window-configure.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build desktopApp/build/native-window/windows --config Release --parallel 2 --verbose 2>&1 | Tee-Object verification/window-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($file in @('desktopApp/build/native/windows/bitchord_analysis.dll','desktopApp/build/native/windows/bitchord_smtc.dll','desktopApp/build/native-window/windows/bitchord_window.dll')) {
            if (-not (Test-Path $file)) { throw "Missing original reference target: $file" }
            Get-FileHash -Algorithm SHA256 $file | Format-List | Out-File -Append verification/native-hashes.txt
          }
      - name: Verify protected source preservation
        if: always()
        run: |
          git diff --exit-code
          git status --short | Set-Content verification/worktree.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: phase1-windows-reference-native-diagnostics
          path: |
            reference/verification/
            reference/desktopApp/build/native/windows/CMakeCache.txt
            reference/desktopApp/build/native/windows/CMakeFiles/CMakeConfigureLog.yaml
            reference/desktopApp/build/native-window/windows/CMakeCache.txt
            reference/desktopApp/build/native-window/windows/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: error
