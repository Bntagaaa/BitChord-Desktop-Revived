name: Format Flutter visual parity
on:
  push:
    branches: ["1.9.2-Rewrite"]
    paths:
      - ".github/workflows/flutter-visual-format.yml"
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1.9.2-Rewrite
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
      - name: Format affected Dart files
        run: |
          cd flutterApp
          dart format lib/presentation/widgets.dart lib/presentation/desktop_shell.dart lib/presentation/player_views.dart
          git diff --check
      - name: Commit formatting without overriding others
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flutterApp/lib/presentation/widgets.dart flutterApp/lib/presentation/desktop_shell.dart flutterApp/lib/presentation/player_views.dart
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Apply Dart formatter to Flutter visual parity implementation"
          git push origin HEAD:1.9.2-Rewrite
