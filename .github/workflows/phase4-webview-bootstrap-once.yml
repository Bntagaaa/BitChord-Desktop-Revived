name: Phase 4 embedded WebView dependency bootstrap

on:
  push:
    branches: [2.0.0-flutter]
    paths:
      - '.github/workflows/phase4-webview-bootstrap-once.yml'

permissions:
  contents: write

jobs:
  resolve-lock-and-format:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Resolve new native WebView plugin and format Dart 3.11
        shell: bash
        working-directory: flutterDesktop
        run: |
          set -euo pipefail
          flutter pub get
          flutter pub get --enforce-lockfile
          dart format --language-version=3.11 lib test
          dart format --output=none --set-exit-if-changed lib test
      - name: Retain package lock and source formatting, remove one-time job
        shell: bash
        run: |
          set -euo pipefail
          git rm -- .github/workflows/phase4-webview-bootstrap-once.yml
          git add flutterDesktop/pubspec.lock flutterDesktop/lib flutterDesktop/test
          git diff --cached --check
          git -c user.name="BitChord Phase4 Bootstrap" -c user.email="actions@users.noreply.github.com" commit -m "build(phase4): lock and format the built-in WebView sign-in"
          git push origin HEAD:2.0.0-flutter
