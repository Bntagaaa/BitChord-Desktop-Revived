name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-linux:
    name: Desktop · Linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

      - run: chmod +x gradlew

      # A single-component label used by Build tes Appimage must not become
      # the invalid Windows installer version "1.29" during Gradle configuration.
      - name: Validate short numeric test label
        run: ./gradlew :desktopApp:help "-Pbitchord.version=1"

      - name: Set up X11 for native PiP validation
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      # Regression coverage for the packaging failure: the app may use a descriptive
      # test label, but native installer metadata must remain a valid numeric version.
      - name: Tests
        env:
          BITCHORD_PIP_NATIVE_TEST: '1'
        shell: bash
        run: xvfb-run -a ./gradlew :shared:jvmTest :desktopRuntime:test :desktopUi:jvmTest :desktopApp:test "-Pbitchord.version=test-visua" --console=plain 2>&1 | tee desktop-tests.log

      - name: Report test failures
        if: failure()
        run: python .github/scripts/report-desktop-test-failures.py

      - name: Build the distributable
        run: ./gradlew :desktopApp:createDistributable "-Pbitchord.version=test-visua"

      - name: Verify packaged player matches compiled UI
        run: python3 .github/scripts/check-packaged-player-ui.py desktopApp/build/compose/binaries/main/app/BitChord

      - name: Linux packaged AutoMix JNI and model regression
        run: bash desktopApp/packaging/tests/linux-automix-check.sh

      - name: The analyser is in the jar
        run: |
          jar=$(ls desktopApp/build/compose/binaries/main/app/BitChord/lib/app/desktopApp*.jar)
          jar tf "$jar" | grep -q 'native/libbitchord_analysis.so'
          jar tf "$jar" | grep -q 'models/.*\.onnx'

      - name: Upload PiP render evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-linux-render-evidence
          path: desktopApp/build/reports/pip-rebuild/
          if-no-files-found: ignore

      - name: Upload landscape player render evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: landscape-player-linux-render-evidence
          path: |
            desktopUi/build/reports/landscape-player/
            desktopApp/build/reports/landscape-player/
          if-no-files-found: ignore

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-test-reports
          path: |
            desktopApp/build/reports/tests/
            shared/build/reports/tests/
            desktopUi/build/reports/tests/

  desktop-windows:
    name: Desktop · Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        shell: bash
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

      - name: CMake version
        run: cmake --version

      # Compose Desktop honors WIX_PATH and skips the unreliable downloadWix
      # GitHub Releases request. windows-latest ships WiX Toolset 3.14.
      - name: Use preinstalled WiX Toolset 3
        shell: pwsh
        run: |
          $wixBin = $null
          $fromPath = Get-Command candle.exe -ErrorAction SilentlyContinue
          if ($fromPath) {
            $candidate = Split-Path -Parent $fromPath.Source
            if (Test-Path (Join-Path $candidate 'light.exe')) { $wixBin = $candidate }
          }
          if (-not $wixBin) {
            $roots = @(${env:ProgramFiles(x86)}, $env:ProgramFiles) | Where-Object { $_ -and (Test-Path $_) }
            $candidates = @(
              foreach ($root in $roots) {
                Get-ChildItem -Path $root -Directory -Filter 'WiX Toolset v3*' -ErrorAction SilentlyContinue |
                  ForEach-Object { Join-Path $_.FullName 'bin' }
              }
            )
            $wixBin = $candidates | Where-Object {
              (Test-Path (Join-Path $_ 'candle.exe')) -and (Test-Path (Join-Path $_ 'light.exe'))
            } | Select-Object -First 1
          }
          if (-not $wixBin) { throw 'WiX 3.x not found on Windows runner; cannot build MSI without it' }
          "WIX_PATH=$wixBin" >> $env:GITHUB_ENV
          "$wixBin" >> $env:GITHUB_PATH
          Write-Host "WiX Toolset: $wixBin"

      # Keep Windows' EXE/MSI metadata valid for the same descriptive build labels.
      - name: Tests
        run: |
          .\gradlew.bat :shared:jvmTest :desktopRuntime:test :desktopUi:jvmTest :desktopApp:test "-Pbitchord.version=test-visua" --console=plain 2>&1 | Tee-Object -FilePath desktop-tests.log
          exit $LASTEXITCODE

      - name: Report test failures
        if: failure()
        run: python .github/scripts/report-desktop-test-failures.py

      - name: Build the distributable
        run: .\gradlew.bat :desktopApp:createDistributable "-Pbitchord.version=test-visua"

      - name: Verify packaged player matches compiled UI
        run: python .github/scripts/check-packaged-player-ui.py desktopApp/build/compose/binaries/main/app/BitChord

      - name: Windows packaged AutoMix JNI and dependency regression
        shell: pwsh
        run: ./desktopApp/packaging/tests/windows-automix-check.ps1

      - name: The analyser is in the jar
        shell: bash
        run: |
          jar=$(ls desktopApp/build/compose/binaries/main/app/BitChord/app/desktopApp*.jar)
          jar tf "$jar" | grep -q 'native/bitchord_analysis.dll'
          jar tf "$jar" | grep -q 'models/.*\.onnx'
          # WinRT, so only MSVC can build it and only this job ever does.
          jar tf "$jar" | grep -q 'native/bitchord_smtc.dll'

      - name: Upload PiP render evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-windows-render-evidence
          path: desktopApp/build/reports/pip-rebuild/
          if-no-files-found: ignore

      - name: Upload landscape player render evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: landscape-player-windows-render-evidence
          path: |
            desktopUi/build/reports/landscape-player/
            desktopApp/build/reports/landscape-player/
          if-no-files-found: ignore

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-test-reports
          path: |
            desktopApp/build/reports/tests/
            shared/build/reports/tests/
            desktopUi/build/reports/tests/

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

      - run: chmod +x gradlew

      - name: Tests
        run: |
          set +e
          ./gradlew testDevDebugUnitTest --console=plain 2>&1 | tee /tmp/bitchord-android-tests.log
          test_status=${PIPESTATUS[0]}
          if [ "$test_status" -ne 0 ]; then
            python3 - <<'PYERRORS'
          import re
          from pathlib import Path
          lines = Path('/tmp/bitchord-android-tests.log').read_text(errors='replace').splitlines()
          errors = [line for line in lines if re.search(r'(^e: |error:|Execution failed for task|^> .*[Ff]ail)', line)]
          for line in errors[:80]:
              print('::error::' + line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PYERRORS
          fi
          exit "$test_status"

      - name: Build the dev APK
        run: ./gradlew assembleDevDebug

      - name: Upload the dev APK
        uses: actions/upload-artifact@v4
        with:
          name: bitchord-dev-debug
          path: app/build/outputs/apk/dev/debug/*.apk

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: app/build/reports/tests/

  backend:
    name: Backend · Go
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
