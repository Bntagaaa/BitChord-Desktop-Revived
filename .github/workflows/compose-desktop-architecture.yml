name: Compose desktop architecture

on:
  push:
    branches: [1.9.2-Compose-Dekstop]
    paths:
      - 'desktop*/**'
      - 'shared*/**'
      - 'app/**'
      - 'native/**'
      - '*.gradle.kts'
      - gradle.properties
      - 'gradle/**'
      - .github/workflows/compose-desktop-architecture.yml
      - .github/workflows/check.yml
      - .github/workflows/build-test-appimage.yml
      - .github/workflows/build-windows-portable.yml
      - .github/scripts/check-packaged-player-ui.py
      - .github/scripts/report-desktop-test-failures.py
  workflow_dispatch:
    inputs:
      try_create_pr:
        description: 'Retry draft creation after repository Actions permissions allow it'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: compose-architecture-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/check.yml
    secrets: inherit

  appimage:
    uses: ./.github/workflows/build-test-appimage.yml
    with:
      version: 1.9.2-compose-${{ github.sha }}
      run_tests: false
    secrets: inherit

  windows-packages:
    uses: ./.github/workflows/build-windows-portable.yml
    with:
      version: 1.9.2-compose-${{ github.sha }}
      installers: true
    secrets: inherit

  draft-pr:
    # Repository policy currently rejects createPullRequest from Actions.
    # Keep a deliberate retry available without turning every build red.
    if: github.event_name == 'workflow_dispatch' && inputs.try_create_pr
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Create or update only the Compose experiment draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          trap 'echo "::error::Draft PR automation failed; inspect the preceding GitHub CLI error. No branch was merged or reset."' ERR
          run_gh() {
            if gh "$@" 2>pr-error.log; then
              return 0
            else
              code=$?
              while IFS= read -r line; do echo "::error::$line" >&2; done < pr-error.log
              return "$code"
            fi
          }
          test "$GITHUB_REPOSITORY" = "Bntagaaa/BitChord-Desktop-Revived"
          test "$GITHUB_REF_NAME" = "1.9.2-Compose-Dekstop"
          number=$(run_gh pr list --state open --base 1.9.2 --head 1.9.2-Compose-Dekstop --json number --jq '.[0].number // empty')
          if [[ -n "$number" ]]; then
            run_gh pr edit "$number" --title "Desktop Compose architecture and resource ownership" --body-file docs/architecture/compose-pr.md
          else
            run_gh pr create --draft --base 1.9.2 --head 1.9.2-Compose-Dekstop \
              --title "Desktop Compose architecture and resource ownership" --body-file docs/architecture/compose-pr.md
          fi
