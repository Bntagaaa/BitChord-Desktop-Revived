name: Compose desktop architecture

on:
  push:
    branches: [1.9.2-Compose-Dekstop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compose-architecture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/check.yml
    secrets: inherit

  appimage:
    uses: ./.github/workflows/build-test-appimage.yml
    with:
      version: 1.9.2-compose-${{ github.sha }}
      run_tests: false
    secrets: inherit

  draft-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Create or update only the Compose experiment draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Bntagaaa/BitChord-Desktop-Revived"
          test "$GITHUB_REF_NAME" = "1.9.2-Compose-Dekstop"
          number=$(gh pr list --state open --base 1.9.2 --head 1.9.2-Compose-Dekstop --json number --jq '.[0].number // empty')
          if [[ -n "$number" ]]; then
            gh pr edit "$number" --title "Desktop Compose architecture and resource ownership" --body-file docs/architecture/compose-pr.md
          else
            gh pr create --draft --base 1.9.2 --head 1.9.2-Compose-Dekstop \
              --title "Desktop Compose architecture and resource ownership" --body-file docs/architecture/compose-pr.md
          fi
