name: Windows Portable Quick Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Test build version"
        required: false
        type: string
        default: "dev-test"

permissions:
  contents: read

concurrency:
  group: portable-quick-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: Build Windows portable ZIP
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        shell: bash
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        run: |
          printf 'LASTFM_API_KEY=%s\n' "$LASTFM_API_KEY" > local.properties
          printf 'LASTFM_SECRET=%s\n' "$LASTFM_SECRET" >> local.properties

      - name: Build portable application only
        shell: pwsh
        run: |
          .\gradlew.bat :desktopApp:createDistributable "-Pbitchord.version=${{ inputs.version }}" --build-cache

      - name: Package portable ZIP
        shell: pwsh
        run: |
          $appRoot = "desktopApp/build/compose/binaries/main/app"
          if (-not (Test-Path $appRoot)) {
            throw "Portable application directory not found: $appRoot"
          }
          $appDirs = @(Get-ChildItem $appRoot -Directory)
          if ($appDirs.Count -ne 1) {
            throw "Expected exactly one app directory in $appRoot; found $($appDirs.Count)"
          }
          New-Item -ItemType Directory -Force dist | Out-Null
          $version = "${{ inputs.version }}" -replace '[^a-zA-Z0-9._-]', '-'
          $zipPath = Join-Path $env:GITHUB_WORKSPACE "dist/BitChord-$version-windows-x64-portable.zip"
          New-Item -ItemType File -Force (Join-Path $appDirs[0].FullName ".bitchord-portable") | Out-Null
          Push-Location $appRoot
          try {
            & 7z a -tzip -mx=3 $zipPath $appDirs[0].Name
            if ($LASTEXITCODE -ne 0) { throw "7-Zip packaging failed" }
          } finally {
            Pop-Location
          }
          if (-not (Test-Path $zipPath)) { throw "Portable ZIP not created" }
          Get-Item $zipPath | Select-Object Name, Length

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: BitChord-Portable-${{ inputs.version }}
          path: dist/*-portable.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
