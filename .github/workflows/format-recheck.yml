name: Temporary Dart format recheck
on:
  push:
    branches: [2.0.0-flutter]
    paths: ['.github/workflows/format-recheck.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Format exactly as app CI, return one inspected file
        working-directory: flutterDesktop
        run: |
          dart format lib test
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('lib/features/online/data/online_runtime.dart')
          print('FORMAT_RECHECK=' + json.dumps({
              'path': 'flutterDesktop/' + str(p),
              'content': p.read_text(),
          }, separators=(',', ':')))
          PY
