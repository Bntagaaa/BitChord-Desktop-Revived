name: Flutter reworked port
on:
  push:
    branches: [1.9.2-flutter-reworked]
    paths: ['flutterApp/**', '.github/workflows/flutter-reworked.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: flutter-reworked-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: flutterApp
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100
      - run: python3 tool/verify_source.py
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Require formatted source with no unapplied Dart fixes
        run: |
          dart format lib test integration_test > format.log 2>&1
          dart fix --apply >> format.log 2>&1
          dart format lib test integration_test >> format.log 2>&1
          git diff --exit-code -- lib test integration_test >> format.log 2>&1
      - name: Publish formatter diagnostics
        if: failure()
        shell: python
        run: |
          from pathlib import Path
          if Path('format.log').exists():
              for line in Path('format.log').read_text(errors='replace')[-6000:].splitlines():
                  print('::error::' + line.replace('%','%25'))
      - name: Save reviewable formatting patch
        if: always()
        shell: python
        run: |
          import base64, pathlib, subprocess, zlib
          patch = subprocess.check_output(['git', 'diff', '--', 'lib', 'test', 'integration_test'])
          pathlib.Path('format.patch').write_bytes(patch)
          encoded = base64.b64encode(zlib.compress(patch)).decode()
          def publish(kind, encoded):
              chunks = [encoded[i:i+2800] for i in range(0,len(encoded),2800)]
              for index, chunk in list(enumerate(chunks))[:8]:
                  print('::notice title=Dart source fixes::'+kind+'|'+str(index)+'|'+str(len(chunks))+'|'+chunk)
          publish('PATCH',encoded)
      - name: Save remaining Dart formatting evidence
        if: always()
        shell: python
        run: |
          import base64, pathlib, zlib
          encoded=base64.b64encode(zlib.compress(pathlib.Path('format.patch').read_bytes())).decode()
          chunks=[encoded[i:i+2800] for i in range(0,len(encoded),2800)]
          if len(chunks)>16:
              raise SystemExit('Formatting patch exceeds the evidence chunk limit')
          for index,chunk in list(enumerate(chunks))[8:]:
              print('::notice title=Dart source fixes::PATCH|'+str(index)+'|'+str(len(chunks))+'|'+chunk)
      - name: Save resolved package lock evidence
        if: always()
        shell: python
        run: |
          import base64, pathlib, zlib
          lock = pathlib.Path('pubspec.lock')
          if lock.exists():
              encoded=base64.b64encode(zlib.compress(lock.read_bytes())).decode()
              chunks=[encoded[i:i+2800] for i in range(0,len(encoded),2800)]
              for index,chunk in enumerate(chunks):
                  print('::notice title=Dart package lock::LOCK|'+str(index)+'|'+str(len(chunks))+'|'+chunk)
      - name: Analyze with zero warnings or infos
        run: flutter analyze --no-pub --fatal-infos --fatal-warnings > analyze.log 2>&1
      - name: Publish analyzer diagnostics
        if: always()
        shell: python
        run: |
          from pathlib import Path
          import re
          for line in Path('analyze.log').read_text(errors='replace').splitlines() if Path('analyze.log').exists() else []:
              if re.search(r'^\s*(error|warning|info)\s+•', line) or 'Could not find an option' in line:
                  print('::error::' + line)
      - name: Unit and widget tests
        run: flutter test --reporter expanded > tests.log 2>&1
      - name: Publish validation summary
        shell: python
        run: |
          from pathlib import Path
          import re
          analysis = Path('analyze.log').read_text(errors='replace')
          tests = Path('tests.log').read_text(errors='replace')
          if 'No issues found!' not in analysis or 'All tests passed!' not in tests:
              raise SystemExit('Expected completed analyzer and test evidence')
          results = re.findall(r'\+(\d+).*All tests passed!', tests)
          print('::notice::Dart analysis: zero errors/warnings/infos; unit/widget tests passed: ' + (results[-1] if results else 'see tests.log'))
      - name: Publish test failures
        if: failure()
        shell: python
        run: |
          from pathlib import Path
          if Path('tests.log').exists():
              text=Path('tests.log').read_text(errors='replace')[-8000:]
              print('::error::'+text.replace('%','%25').replace('\n','%0A'))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flutter-reworked-checks
          path: |
            flutterApp/analyze.log
            flutterApp/tests.log
            flutterApp/format.patch
            flutterApp/format.log
            flutterApp/pubspec.lock
  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: flutterApp
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libasound2-dev libmpv-dev xvfb xdotool imagemagick tesseract-ocr pulseaudio
      - name: Generate standard native Flutter runners
        run: flutter create --platforms=linux,windows --org=com.music --project-name=bitchord --no-pub .
      - name: Use the original Windows application icon
        if: runner.os == 'Windows'
        run: Copy-Item ../desktopApp/packaging/icons/AppIcon.ico windows/runner/resources/app_icon.ico -Force
      - run: flutter pub get
      - name: Build Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          flutter build linux --release 2>&1 | tee build-linux.log
      - name: Build Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          flutter build windows --release 2>&1 | Tee-Object -FilePath build-windows.log
          exit $LASTEXITCODE
      - name: Verify real Linux window and settings interaction
        if: runner.os == 'Linux'
        run: xvfb-run -a -s '-screen 0 1280x900x24' bash tool/smoke-linux.sh
      - name: Verify native audio decode, playhead and seek
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          pulseaudio --check || pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=bitchord_test
          pactl set-default-sink bitchord_test
          xvfb-run -a flutter test integration_test/native_audio_test.dart -d linux --reporter expanded 2>&1 | tee native-audio.log
      - name: Verify Windows native window
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Resolve-Path build/windows/x64/runner/Release/bitchord.exe
          $app = Start-Process $exe -PassThru
          try {
            for ($i=0; $i -lt 40; $i++) {
              Start-Sleep -Seconds 1
              $app.Refresh()
              if ($app.HasExited) { throw 'Flutter app exited before native-window validation' }
              if ($app.MainWindowHandle -ne 0) { break }
            }
            if ($app.MainWindowHandle -eq 0) { throw 'No Windows native window was shown' }
            Write-Output '::notice::Flutter Windows native window was shown'
          } finally { if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force } }
      - name: Report native build or launch failure
        if: failure()
        shell: python
        run: |
          from pathlib import Path
          for path in [Path('build-linux.log'),Path('build-windows.log'),Path('native-audio.log'),Path('build/reports/native-window/application.log')]:
              if path.exists():
                  text=path.read_text(errors='replace')[-3000:]
                  print('::error::'+text.replace('%','%25').replace('\n','%0A'))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Flutter-native-evidence-${{ runner.os }}
          path: |
            flutterApp/native-audio.log
            flutterApp/build-linux.log
            flutterApp/build-windows.log
            flutterApp/build/reports/native-window/
      - uses: actions/upload-artifact@v4
        with:
          name: BitChord-Flutter-${{ runner.os }}-${{ github.sha }}
          path: |
            flutterApp/build/linux/x64/release/bundle/
            flutterApp/build/windows/x64/runner/Release/
          if-no-files-found: error
