name: YouTube rewrite context
on:
  push:
    branches: ['2.0.0-flutter']
    paths: ['.github/workflows/youtube-rewrite-toolchain.yml']
permissions:
  contents: read
jobs:
  context:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Capture reviewed public source context
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin 348b613a0c3db1a54de56483ea6f8748d6465211
          mkdir -p rewrite-context
          python3 -m pip download --no-deps yt-dlp==2026.10.26 -d rewrite-context
          python3 - <<'PY'
          import pathlib, subprocess, zipfile
          reference = '348b613a0c3db1a54de56483ea6f8748d6465211'
          names = subprocess.check_output(['git', 'ls-tree', '-r', '--name-only', reference], text=True).splitlines()
          wanted = {'StreamResolver.kt', 'PlayerClient.kt', 'DesktopYouTubeSession.kt', 'DesktopYouTubeAuth.kt', 'InnertubeParser.kt'}
          with zipfile.ZipFile('rewrite-context/context.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for path in pathlib.Path('.').glob('*.md'):
                  archive.write(path, 'current/' + str(path))
              for path in pathlib.Path('.github/workflows').glob('*.yml'):
                  archive.write(path, 'current/' + str(path))
              for name in names:
                  if pathlib.PurePosixPath(name).name in wanted:
                      archive.writestr('reference/' + name, subprocess.check_output(['git', 'show', reference + ':' + name]))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: youtube-rewrite-context
          path: rewrite-context/
          retention-days: 1
