name: bitchord
publish_to: none
description: BitChord desktop port sourced from the pinned 1.9.2 implementation.
version: 1.9.2+1
environment:
  sdk: '>=3.9.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  crypto: 3.0.8
  http: 1.6.0
  media_kit: 1.2.6
  media_kit_libs_audio: 1.0.7
  flutter_svg: 2.2.1
  window_manager: 0.5.1
  file_picker: 10.3.3
  path_provider: 2.1.5
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/icons/
  fonts:
    - family: SFProDefault
      fonts:
        - asset: assets/fonts/sf_pro_display_regular.otf
          weight: 400
        - asset: assets/fonts/sf_pro_display_regular.otf
          weight: 500
        - asset: assets/fonts/sf_pro_display_medium.otf
          weight: 600
        - asset: assets/fonts/sf_pro_display_semibold.otf
          weight: 700
        - asset: assets/fonts/sf_pro_display_bold.otf
          weight: 800
    - family: SFProLegacy
      fonts:
        - asset: assets/fonts/sf_pro_display_regular.otf
          weight: 400
        - asset: assets/fonts/sf_pro_display_medium.otf
          weight: 500
        - asset: assets/fonts/sf_pro_display_semibold.otf
          weight: 600
        - asset: assets/fonts/sf_pro_display_bold.otf
          weight: 700
        - asset: assets/fonts/sf_pro_display_heavy.otf
          weight: 800
    - family: BintangMusic
      fonts:
        - asset: assets/fonts/bintang_music_black_about.ttf
          weight: 900
